apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        # Changing the ConfigMap alters this hash, which changes the pod
        # template and so triggers a rollout. Without it, env vars are read
        # once at container start and config edits are silently ignored.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The app never talks to the Kubernetes API, so don't give it a token.
      automountServiceAccountToken: false
      securityContext:
        {{- include "shop.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "shop.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            {{- include "shop.dbCredentialEnv" . | nindent 12 }}
          # Not ready -> removed from the Service, no traffic, no restart.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Not alive -> container is restarted. Deliberately does NOT check
          # the database: a DB outage would otherwise crash-loop every pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "shop.containerSecurityContext" . | nindent 12 }}
          # Gunicorn needs a writable /tmp for worker heartbeats; everything
          # else stays read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Stable virtual IP + DNS name "api" that load-balances across ready API pods.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
