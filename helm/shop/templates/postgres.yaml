# Headless Service (clusterIP: None): no load balancing, just a stable DNS
# name "postgres" that points at the StatefulSet's pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "shop.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
---
# StatefulSet instead of Deployment: the pod keeps a stable name (postgres-0)
# and its own disk, which survives pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  # Single replica: replicas>1 would give each pod its own empty database, not
  # a replicated one. Real HA needs streaming replication and failover (an
  # operator such as CloudNativePG) or a managed service.
  replicas: 1
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            # Subfolder, because the volume root contains "lost+found"
            # and initdb refuses to use a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            # Generous: Postgres replays its write-ahead log on an unclean
            # start, and killing it mid-recovery would crash-loop it.
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # Kubernetes creates one PersistentVolumeClaim per pod from this template.
  # It is NOT deleted with the StatefulSet, so data survives a reinstall.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
